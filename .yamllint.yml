extends: default
ignore: |
  monitoring/grafana/dashboards/
  .gitlab-ci.yml
rules:
  line-length: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
