name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: notes-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run unit tests
        working-directory: app
        run: python -m pytest -v

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 $IMAGE_NAME:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:5000/health
          curl --fail http://localhost:5000/metrics | head -5
          docker rm -f smoke

  deploy:
    name: Deploy (validate manifests)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          pip install kubernetes-validate
          kubernetes-validate k8s/deployment.yaml k8s/service.yaml

      - name: Deployment step
        run: echo "Deploy stage reached - apply k8s/ manifests with kubectl on the target cluster"
