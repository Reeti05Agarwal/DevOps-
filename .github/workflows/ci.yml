name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: notes-service
  APP_VERSION: "1.0.${{ github.run_number }}"

jobs:
  lint:
    name: Lint (Python, Dockerfile, YAML, Ansible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff==0.6.9 yamllint ansible-core ansible-lint

      - name: Ruff (Python style and bugs)
        run: ruff check app/

      - name: Hadolint (Dockerfile best practices)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: yamllint
        run: yamllint -c .yamllint.yml .

      - name: Ansible syntax check
        working-directory: ansible
        run: ansible-playbook playbook.yml --syntax-check

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint playbook.yml

      - name: Validate Kubernetes manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s/ | ./kubeconform -strict -summary -

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run tests with coverage
        working-directory: app
        run: python -m pytest -v --cov=main --cov-report=term-missing --cov-report=xml --cov-fail-under=85 --junitxml=junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/coverage.xml
            app/junit.xml

  build:
    name: Build image + smoke test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --build-arg APP_VERSION=$APP_VERSION \
            -t $IMAGE_NAME:$APP_VERSION -t $IMAGE_NAME:${{ github.sha }} .
          docker image ls $IMAGE_NAME

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 $IMAGE_NAME:$APP_VERSION
          for i in $(seq 1 15); do curl -sf localhost:5000/health && break; sleep 1; done
          curl -sf localhost:5000/health
          curl -sf localhost:5000/version | grep "$APP_VERSION"
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"text":"ci"}' localhost:5000/notes
          curl -sf localhost:5000/metrics | grep http_requests_total
          docker logs smoke
          docker rm -f smoke

      - name: Save image for later jobs
        run: docker save $IMAGE_NAME:$APP_VERSION -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 3

  scan:
    name: Security scan (Trivy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - run: docker load -i image.tar

      - name: Scan image for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"   # report only; set to "1" to block the pipeline
          format: table

      - name: Scan Kubernetes + Dockerfile config
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  deploy:
    name: Deploy to Kubernetes (kind)
    needs: [build, scan]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - run: docker load -i image.tar

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Load image into the cluster
        run: kind load docker-image $IMAGE_NAME:$APP_VERSION --name ci

      - name: Deploy
        run: |
          kubectl apply -k k8s/
          kubectl -n notes set image deployment/notes-service notes-service=$IMAGE_NAME:$APP_VERSION
          kubectl -n notes annotate deployment/notes-service \
            kubernetes.io/change-cause="CI run ${{ github.run_number }} (${{ github.sha }})" --overwrite

      - name: Wait for rollout (auto-rollback on failure)
        run: |
          if ! kubectl -n notes rollout status deployment/notes-service --timeout=120s; then
            echo "::error::Rollout failed, rolling back"
            kubectl -n notes describe deployment notes-service
            kubectl -n notes rollout undo deployment/notes-service
            exit 1
          fi
          kubectl -n notes get deploy,rs,pods,svc -o wide

      - name: Smoke test through the Service
        run: |
          kubectl -n notes port-forward svc/notes-service 8080:80 &
          sleep 3
          curl -sf localhost:8080/health
          curl -sf localhost:8080/version | grep "$APP_VERSION"

      - name: Rollout history
        run: kubectl -n notes rollout history deployment/notes-service

  publish:
    name: Push image to GHCR
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image

      - run: docker load -i image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          REPO=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME
          for tag in $APP_VERSION ${{ github.sha }} latest; do
            docker tag $IMAGE_NAME:$APP_VERSION $REPO:$tag
            docker push $REPO:$tag
          done
          echo "### Published \`$REPO:$APP_VERSION\`" >> $GITHUB_STEP_SUMMARY
