# Optional: needs metrics-server (minikube addons enable metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notes-service
  labels:
    app: notes-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notes-service
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
