global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: notes-service
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]
        labels:
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
