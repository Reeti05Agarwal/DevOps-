# GitLab CI/CD for the GitLab Transcend hackathon ("Life After Code", Path B: Bring Your Own).
# Covers the post-code DevSecOps stages: verify -> package -> secure -> release -> configure -> monitor.
# GitLab Duo Agent Platform agents/flows are layered on top (see docs/HACKATHON.md).

stages:
  - verify
  - package
  - secure
  - release
  - deploy
  - monitor

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  APP_VERSION: "1.0.$CI_PIPELINE_IID"
  # Set these as CI/CD variables to enable the Cloud Run deploy (Google Cloud bonus):
  #   GCP_PROJECT_ID, GCP_REGION, GCP_SA_KEY (base64 service-account JSON, masked)

default:
  image: python:3.12-slim
  interruptible: true

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

# ---------- verify ----------
lint:
  stage: verify
  script:
    - pip install -q ruff==0.6.9 yamllint
    - ruff check app/
    - yamllint -c .yamllint.yml .

unit-tests:
  stage: verify
  script:
    - pip install -q -r app/requirements-dev.txt
    - cd app && python -m pytest -v --cov=main --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: app/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: app/coverage.xml

# ---------- package ----------
build-image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --build-arg APP_VERSION=$APP_VERSION -t $IMAGE .
    - docker run -d --name smoke -p 5000:5000 $IMAGE
    - sleep 5
    - docker exec smoke python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:5000/health').read())"
    - docker push $IMAGE

# ---------- secure ----------
container_scanning:
  stage: secure
  variables:
    CS_IMAGE: $IMAGE

# ---------- release ----------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "notes-service $CI_COMMIT_TAG - image $IMAGE"

# ---------- deploy (configure) ----------
deploy-cloud-run:
  stage: deploy
  image: google/cloud-sdk:slim
  environment:
    name: production
    url: $CLOUD_RUN_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
  script:
    - echo "$GCP_SA_KEY" | base64 -d > /tmp/sa.json
    - gcloud auth activate-service-account --key-file=/tmp/sa.json
    - gcloud config set project "$GCP_PROJECT_ID"
    - gcloud builds submit --tag "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/notes/notes-service:$CI_COMMIT_SHORT_SHA" .
    - >
      gcloud run deploy notes-service
      --image "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/notes/notes-service:$CI_COMMIT_SHORT_SHA"
      --region "$GCP_REGION" --allow-unauthenticated --port 5000
      --set-env-vars APP_VERSION=$APP_VERSION
    - URL=$(gcloud run services describe notes-service --region "$GCP_REGION" --format='value(status.url)')
    - echo "CLOUD_RUN_URL=$URL" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

# ---------- monitor ----------
post-deploy-check:
  stage: monitor
  needs: [deploy-cloud-run]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
  image: curlimages/curl:latest
  script:
    - curl -sf "$CLOUD_RUN_URL/health"
    - curl -sf "$CLOUD_RUN_URL/version"
    - curl -sf "$CLOUD_RUN_URL/metrics" | grep http_requests_total
